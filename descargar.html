<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://api.npoint.io" crossorigin><link rel="preconnect" href="https://acceptable.a-ads.com" crossorigin><link rel="stylesheet" href="style.css"><title>Preparando Descarga</title></head><body style="padding-top:0"><div class="container" style="padding-top:0"><div class="caja-descarga"><img id="imagen-producto" class="img-producto" src="" alt="Icono" style="display:none" decoding="async" fetchpriority="high"><h1 id="titulo-producto">Cargando...</h1><p class="texto-info">Tu archivo se está procesando de manera segura.</p><div id="contenedor-enlace" class="contenedor-enlace"><span class="contador-texto" id="texto-estado">Preparando la descarga...</span></div><div id="contenedor-publicidad" style="background:#121212;border-radius:8px;overflow:hidden;margin:20px auto;padding:12px;text-align:center;width:95%;max-width:440px"></div><div id="contenedor-requisitos" class="seccion-requisitos" style="display:none"></div></div></div><script>document.addEventListener("DOMContentLoaded", function() {
    const esChrome49 = /Chrome\/49\./.test(navigator.userAgent);
    const contenedorPubli = document.getElementById('contenedor-publicidad');

    if (contenedorPubli) {
        if (esChrome49) {
            // Inyecta el bloque exclusivo para Chrome 49 (Ad Unit 2451542)
            contenedorPubli.innerHTML = `
                <div style="width: 100%; margin: auto; position: relative; z-index: 99998;">
                    <iframe data-aa='2451542' src='//acceptable.a-ads.com/2451542/?size=Adaptive' style='border:0; padding:0; width:70%; height:auto; overflow:hidden; display: block; margin: auto;'></iframe>
                </div>`;
        } else {
            // Inyecta el bloque normal para navegadores modernos (Ad Unit 2448508)
            contenedorPubli.innerHTML = `
                <iframe data-aa='2448508' src='//acceptable.a-ads.com/2448508/?size=Adaptive' style='border:0; padding:0; width:100%; min-height:90px; height:auto; overflow:hidden; display: block; margin: auto; background: transparent;'></iframe>`;
        }
    }
});

function obtenerParametro(nombre) {
    nombre = nombre.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
    var regex = new RegExp("[\\?&]" + nombre + "=([^&#]*)"),
        resultados = regex.exec(window.location.search);
    return resultados === null ? null : decodeURIComponent(resultados[1].replace(/\+/g, " "));
}
const identificador = obtenerParametro('id');
const imagenUrl = obtenerParametro('img');
const imgElement = document.getElementById('imagen-producto');
const tituloElement = document.getElementById('titulo-producto');
const contenedorRequisitos = document.getElementById('contenedor-requisitos');
const contenedorEnlace = document.getElementById('contenedor-enlace');

if (imagenUrl && imgElement) {
    imgElement.src = decodeURIComponent(imagenUrl);
    imgElement.style.display = 'block'; 
}

if (identificador) {
    tituloElement.textContent = identificador;
    document.title = "Descargando: " + identificador; 
    
    fetch('requisitos.json')
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(datos => {
            if (datos && datos[identificador] && contenedorRequisitos) {
                const requisitosHtml = datos[identificador];
                contenedorRequisitos.innerHTML = '<h3>Requisitos Mínimos:</h3>' + requisitosHtml;
                contenedorRequisitos.style.display = 'block'; 
            }
        })
        .catch(err => console.error("Error al cargar requisitos:", err));
}

let enlaceReal = null;
let errorCarga = false;
let segundosRestantes = 5;
const URL_EXTERNA = 'https://api.npoint.io/9a5fd87fba9afa240fa2';

const peticionEnlace = fetch(URL_EXTERNA)
  .then(res => res.ok ? res.json() : Promise.reject("Error de red"))
  .then(datos => {
    enlaceReal = datos[identificador] || null;
    if (!enlaceReal) errorCarga = true;
  })
  .catch(() => {
    errorCarga = true;
  });

const cuentaRegresiva = setInterval(() => {
  segundosRestantes--;
  if (contenedorEnlace) { 
    if (segundosRestantes > 0) {
       contenedorEnlace.innerHTML = `<span class="contador-texto">Tu enlace estará listo en ${segundosRestantes} segundos...</span>`;
    } else {
      clearInterval(cuentaRegresiva);
      peticionEnlace
        .then(mostrarBotonOptimizado)
        .catch(mostrarBotonOptimizado);
    }
  }
}, 1000);

function mostrarBotonOptimizado() {
    if (!contenedorEnlace) return;
    
    if (enlaceReal) {
        const urlLower = enlaceReal.toLowerCase();
        let contenidoBoton = 'Ir al sitio oficial';
        let claseColor = 'btn-obtener'; 

        if (urlLower.includes('mediafire.com')) {
            contenidoBoton = `Descargar en <img src="img/mediafire.webp" alt="MediaFire" class="icon-servidor" onerror="this.outerHTML='<b style=\\'margin-left:4px;\\'>MediaFire</b>'">`;
            claseColor = 'btn-obtener'; 
        } else if (urlLower.includes('drive.google.com') || urlLower.includes('docs.google.com')) {
            contenidoBoton = `Descargar en <img src="img/google driver.webp" alt="Google Drive" class="icon-servidor" onerror="this.outerHTML='<b style=\\'margin-left:4px;\\'>Google Drive</b>'">`;
            claseColor = 'btn-obtener google'; 
        } else {
            contenidoBoton = 'Ir al sitio oficial';
            claseColor = 'btn-obtener rojo'; 
        }

        contenedorEnlace.innerHTML = `<a href="${enlaceReal}" class="${claseColor}" rel="nofollow noopener noreferrer" target="_blank">${contenidoBoton}</a>`;
    } else if (errorCarga) {
        contenedorEnlace.innerHTML = '<span style="color:#ff3333; font-weight:bold;">Error: El enlace no existe o no estas conectado a internet.</span>';
    } else {
        contenedorEnlace.innerHTML = '<span class="contador-texto" style="color:#ffcc00;">Buscando enlace...</span>';
        setTimeout(mostrarBotonOptimizado, 200);
    }
}</script></body></html>
